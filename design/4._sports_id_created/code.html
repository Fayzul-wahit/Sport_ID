<script>
    const copyBtn = document.getElementById('copy-btn');
    const copyIcon = document.getElementById('copy-icon');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const shareBtn = document.getElementById('share-btn');

    function showToast(msg) {
      if (!toast) return;
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const idText = "ATH-2026-018472";
        if (navigator.clipboard) {
          navigator.clipboard.writeText(idText).catch(() => {});
        }
        if (copyIcon) {
          copyIcon.textContent = 'check';
          setTimeout(() => { copyIcon.textContent = 'content_copy'; }, 1500);
        }
        showToast('Sports ID copied: ' + idText);
      });
    }

    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: 'Sports ID - Arun Kumar',
            text: 'Sports ID: ATH-2026-018472 (Kabaddi • Raider)',
            url: window.location.href
          }).catch(() => {});
        } else {
          showToast('Share link ready');
        }
      });
    }
  </script>
